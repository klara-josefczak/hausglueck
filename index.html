<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hausglück · Dein Haushaltsplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WEISS & ROSÉ · CLEAN GIRL AESTHETIC
   Creme · Rosé · Champagner-Gold · Samt
   ============================================================ */
:root {
  --bg: #fbf6f3;
  --bg-soft: #f6ede9;
  --panel: #ffffff;
  --panel-2: #fdf3f1;
  --border: rgba(197,158,160,.28);
  --border-soft: rgba(197,158,160,.16);
  --text: #4b3a3d;
  --text-dim: #a78d90;
  --accent: #e4a7ac;
  --accent-2: #c97f8b;
  --accent-soft: #f7e2e1;
  --gold: #c9a66b;
  --gold-soft: #ecdcb6;
  --green: #9db89a;
  --red: #d08a87;
  --cream: #fbefe4;
  --lilac: #cdb9d4;
  --radius: 16px;
  --radius-s: 10px;
  --shadow: 0 18px 40px rgba(190,150,150,.16), 0 2px 8px rgba(190,150,150,.08);
  --shadow-soft: 0 8px 22px rgba(190,150,150,.12);
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: "Jost", "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --sidebar-w: 264px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(1100px 700px at 90% -10%, rgba(228,167,172,.14), transparent 60%),
    radial-gradient(900px 800px at -10% 110%, rgba(201,166,107,.10), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-weight: 400;
  line-height: 1.65;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; letter-spacing: .015em; color: var(--text); }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
.app { display: flex; min-height: 100vh; }

/* ---------- Sidebar: cremeweiß & rosé ---------- */
.sidebar {
  width: var(--sidebar-w);
  background:
    radial-gradient(520px 260px at 20% 0%, rgba(228,167,172,.14), transparent 65%),
    linear-gradient(168deg, #fffaf8 0%, var(--panel-2) 55%, #f8e9e6 100%);
  border-right: 1px solid var(--border);
  padding: 26px 18px;
  position: fixed;
  top: 0; bottom: 0; left: 0;
  display: flex; flex-direction: column; gap: 5px;
  z-index: 50;
  box-shadow: 6px 0 24px rgba(190,150,150,.12);
  overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 13px; padding: 2px 8px 20px; border-bottom: 1px solid var(--border-soft); margin-bottom: 14px; }
.logo .cube {
  width: 46px; height: 46px; border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, #fff, #f2cfd0 58%, #dfa8ad);
  display: grid; place-items: center; font-family: var(--serif); font-size: 21px;
  color: #a9636d; font-weight: 600;
  border: 1px solid rgba(228,167,172,.55);
  box-shadow: 0 0 0 3px rgba(228,167,172,.16), 0 8px 20px rgba(190,150,150,.28), inset 0 1px 1px rgba(255,255,255,.8);
}
.logo h1 { font-size: 19px; line-height: 1.2; color: var(--text); font-weight: 500; }
.logo h1 span {
  display: block; font-family: var(--sans); font-size: 9.5px; color: var(--accent-2);
  font-weight: 500; letter-spacing: .22em; text-transform: uppercase; margin-top: 3px;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: 12px;
  color: var(--text-dim); cursor: pointer; user-select: none;
  font-size: 12.5px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase;
  border: 1px solid transparent;
  transition: all .18s ease;
}
.nav-item:hover { background: rgba(228,167,172,.14); color: var(--accent-2); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(228,167,172,.30), rgba(228,167,172,.08));
  color: var(--accent-2); border-color: rgba(228,167,172,.5);
  box-shadow: inset 3px 0 0 var(--accent-2);
}
.nav-item .ico { width: 22px; display: grid; place-items: center; opacity: .9; }
.nav-item .ico svg { width: 17px; height: 17px; }
.sidebar-footer { margin-top: auto; padding: 16px 10px 4px; border-top: 1px solid var(--border-soft); }
.level-chip { display: flex; align-items: center; gap: 11px; margin-bottom: 10px; cursor: pointer; border-radius: 12px; padding: 5px 6px; transition: all .18s ease; }
.level-chip:hover { background: rgba(201,166,107,.12); }
.level-chip .lvl {
  width: 42px; height: 42px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 32% 26%, #fbe4e2, #e7b3b6);
  border: 1px solid rgba(228,167,172,.6);
  box-shadow: 0 0 0 3px rgba(228,167,172,.16);
  display: grid; place-items: center; font-family: var(--serif); font-weight: 600; color: #a9636d; font-size: 17px;
}
.level-chip .meta { font-size: 10.5px; color: var(--text-dim); line-height: 1.4; letter-spacing: .10em; text-transform: uppercase; }
.level-chip .meta b { display: block; color: var(--text); font-size: 12.5px; letter-spacing: .06em; font-weight: 500; }
.bar { height: 6px; background: rgba(228,167,172,.18); border-radius: 99px; overflow: hidden; border: 1px solid var(--border-soft); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold-soft)); border-radius: 99px; transition: width .5s ease; }

/* ---------- Main ---------- */
.main { margin-left: var(--sidebar-w); flex: 1; padding: 34px 42px 90px; max-width: 1180px; }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 26px; flex-wrap: wrap; }
.topbar h2 { font-size: 33px; letter-spacing: .01em; line-height: 1.15; }
.topbar p.sub { font-size: 13.5px; color: var(--text-dim); letter-spacing: .05em; margin-top: 5px; }
.overline { font-family: var(--sans); font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: var(--accent-2); font-weight: 500; margin-bottom: 6px; }

/* ---------- Karten & Raster ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow-soft);
  position: relative;
}
.card h3 { font-size: 21px; margin-bottom: 4px; }
.card .desc { font-size: 13px; color: var(--text-dim); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.section { margin-top: 30px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.section-head h3 { font-size: 23px; }

/* ---------- Hero ---------- */
.hero {
  display: flex; align-items: center; gap: 26px;
  background: linear-gradient(120deg, #fff 0%, var(--panel-2) 62%, #f9e6e2 100%);
  border: 1px solid var(--border-soft);
  border-radius: 22px;
  padding: 28px 30px;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(228,167,172,.28), transparent 70%);
}
.hero .hero-txt { flex: 1; }
.hero h2 { font-size: 30px; line-height: 1.2; margin-bottom: 6px; }
.hero p { font-size: 14px; color: var(--text-dim); max-width: 560px; }
.ring-wrap { position: relative; width: 110px; height: 110px; flex: none; }
.ring-wrap .ring-txt { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--serif); font-size: 22px; color: var(--accent-2); font-weight: 600; }

/* ---------- Stats ---------- */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
.stat {
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow-soft);
}
.stat .k { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-dim); }
.stat .v { font-family: var(--serif); font-size: 30px; line-height: 1.15; color: var(--accent-2); font-weight: 600; }
.stat .v small { font-family: var(--sans); font-size: 11px; color: var(--text-dim); letter-spacing: .08em; }

/* ---------- Buttons & Formulare ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 11px 22px; border-radius: 99px; border: 1px solid transparent;
  font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  transition: all .18s ease; white-space: nowrap;
}
.btn.primary {
  background: linear-gradient(120deg, var(--accent) 0%, var(--accent-2) 100%);
  color: #fff; box-shadow: 0 10px 22px rgba(201,127,139,.35);
}
.btn.primary:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(201,127,139,.42); }
.btn.ghost { background: transparent; color: var(--accent-2); border-color: var(--border); }
.btn.ghost:hover { background: rgba(228,167,172,.14); }
.btn.gold { background: linear-gradient(120deg, var(--gold-soft), var(--gold)); color: #6b5322; }
.btn.green { background: linear-gradient(120deg, #b7cfb2, var(--green)); color: #3f5137; }
.btn.danger { background: transparent; color: var(--red); border-color: rgba(208,138,135,.5); }
.btn.small { padding: 8px 15px; font-size: 10.5px; letter-spacing: .10em; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

.input, .select, .textarea {
  width: 100%; padding: 11px 15px; border-radius: 12px;
  border: 1px solid var(--border); background: #fff; color: var(--text);
  font-size: 13.5px; outline: none; transition: all .18s ease;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(228,167,172,.18); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-row.one { grid-template-columns: 1fr; }
.field label { display: block; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }

/* ---------- Tags & Notizen ---------- */
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500;
  padding: 4px 11px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-2);
  border: 1px solid rgba(228,167,172,.35);
}
.tag.green { background: #e9f1e6; color: #6b8562; border-color: rgba(157,184,154,.4); }
.tag.gold { background: var(--cream); color: #a8813d; border-color: rgba(201,166,107,.4); }
.tag.grey { background: #f2ecec; color: var(--text-dim); border-color: var(--border-soft); }
.tag.lilac { background: #f1eaf3; color: #8a6f95; border-color: rgba(205,185,212,.5); }
.note {
  background: var(--cream); border: 1px solid rgba(201,166,107,.3); border-radius: var(--radius-s);
  padding: 13px 16px; font-size: 13px; color: #7a613a; display: flex; gap: 11px; align-items: flex-start;
}
.note .i { flex: none; font-size: 15px; }
.tipbox {
  background: linear-gradient(120deg, #fff7f5, var(--panel-2));
  border: 1px solid var(--border-soft); border-left: 3px solid var(--accent);
  border-radius: var(--radius-s); padding: 14px 17px; margin: 14px 0; font-size: 13.5px;
}
.tipbox .i { color: var(--accent-2); margin-right: 6px; }
.empty { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 30px 16px; font-style: italic; font-family: var(--serif); font-size: 16px; }

/* ---------- Check-Zeilen (Aufgaben) ---------- */
.check-row {
  display: flex; align-items: center; gap: 13px;
  padding: 12px 15px; border-radius: 13px; border: 1px solid var(--border-soft);
  background: var(--panel); margin-bottom: 9px; transition: all .18s ease;
}
.check-row:hover { border-color: var(--border); box-shadow: var(--shadow-soft); }
.check-row.done { background: var(--panel-2); }
.check-row.done .cr-title { text-decoration: line-through; color: var(--text-dim); }
.check {
  width: 22px; height: 22px; border-radius: 50%; flex: none; cursor: pointer;
  border: 2px solid var(--accent); background: #fff;
  display: grid; place-items: center; color: #fff; font-size: 12px; transition: all .18s ease;
}
.check:hover { transform: scale(1.08); }
.check.on { background: linear-gradient(120deg, var(--accent), var(--accent-2)); border-color: var(--accent-2); }
.cr-title { font-size: 14px; font-weight: 500; }
.cr-meta { font-size: 11px; color: var(--text-dim); letter-spacing: .06em; }
.cr-mid { flex: 1; min-width: 0; }
.cr-right { display: flex; align-items: center; gap: 8px; flex: none; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border-soft);
  background: #fff; color: var(--text-dim); display: grid; place-items: center; font-size: 13px;
  transition: all .18s ease;
}
.icon-btn:hover { color: var(--red); border-color: var(--red); }

/* ---------- Wochenplan / Tag ---------- */
.week-strip { display: flex; gap: 9px; flex-wrap: wrap; }
.day-pill {
  flex: 1; min-width: 96px; text-align: center; cursor: pointer;
  border: 1px solid var(--border-soft); border-radius: 14px; padding: 12px 8px; background: var(--panel);
  transition: all .18s ease;
}
.day-pill:hover { border-color: var(--accent); }
.day-pill.today { background: linear-gradient(140deg, var(--accent) 0%, var(--accent-2) 100%); color: #fff; border-color: transparent; box-shadow: 0 10px 20px rgba(201,127,139,.3); }
.day-pill.today .dp-day { color: rgba(255,255,255,.85); }
.day-pill .dp-day { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-dim); }
.day-pill .dp-num { font-family: var(--serif); font-size: 21px; font-weight: 600; }
.day-pill .dp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; margin: 3px 1.5px 0; }
.day-pill.today .dp-dot { background: #fff; }

/* ---------- Kalender ---------- */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.cal-head { text-align: center; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-dim); padding-bottom: 4px; }
.cal-day {
  min-height: 84px; border: 1px solid var(--border-soft); border-radius: 12px; padding: 8px 9px;
  background: var(--panel); cursor: pointer; transition: all .18s ease; position: relative;
}
.cal-day:hover { border-color: var(--accent); box-shadow: var(--shadow-soft); }
.cal-day.other { opacity: .38; }
.cal-day.today { border-color: var(--accent-2); background: var(--panel-2); box-shadow: 0 0 0 2px rgba(228,167,172,.25); }
.cal-day .cd-num { font-family: var(--serif); font-size: 15px; font-weight: 600; }
.cal-day .cd-ev {
  font-size: 9.5px; letter-spacing: .03em; border-radius: 6px; padding: 2px 6px; margin-top: 3px;
  background: var(--accent-soft); color: var(--accent-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cal-day .cd-ev.gold { background: var(--cream); color: #a8813d; }
.cal-day .cd-ev.green { background: #e9f1e6; color: #6b8562; }

/* ---------- Shop ---------- */
.shop-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.shop-tab {
  padding: 8px 18px; border-radius: 99px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text-dim); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; cursor: pointer; transition: all .18s ease;
}
.shop-tab.active { background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
.shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.item-card {
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius);
  padding: 18px; text-align: center; box-shadow: var(--shadow-soft); transition: all .18s ease;
}
.item-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--border); }
.item-art {
  height: 116px; display: grid; place-items: center; margin-bottom: 12px;
  background: linear-gradient(140deg, var(--panel-2), var(--cream)); border-radius: 12px;
}
.item-art svg { width: 116px; height: 82px; }
.item-card h4 { font-size: 18px; margin-bottom: 3px; }
.item-card .desc { font-size: 11.5px; color: var(--text-dim); min-height: 34px; }
.price { display: inline-flex; align-items: center; gap: 6px; font-family: var(--serif); font-size: 17px; color: var(--gold); font-weight: 600; margin: 8px 0 10px; }

/* ---------- Begleiter-Widget ---------- */
#companionWidget {
  position: fixed; right: 26px; bottom: 26px; z-index: 60;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: grab; user-select: none; touch-action: none;
}
#companionWidget:active { cursor: grabbing; }
.cw-bubble {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  padding: 10px 15px; font-family: var(--serif); font-style: italic; font-size: 14.5px;
  color: var(--text); box-shadow: var(--shadow-soft); max-width: 220px; text-align: center;
  position: relative;
}
.cw-bubble::after {
  content: ""; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%) rotate(45deg);
  width: 12px; height: 12px; background: var(--panel); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.cw-fig { width: 118px; filter: drop-shadow(0 12px 18px rgba(190,150,150,.3)); animation: cwFloat 4.2s ease-in-out infinite; }
@keyframes cwFloat { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1.5deg); } }

/* ---------- Modals & Toast ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(75,58,61,.42); backdrop-filter: blur(6px);
  display: flex; overflow-y: auto; -webkit-overflow-scrolling: touch;
  z-index: 100; padding: 22px;
  animation: fadeIn .22s ease;
}
.modal-overlay > * { margin: auto; }
.modal-box {
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: 22px;
  padding: 30px 32px; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  box-shadow: 0 30px 70px rgba(120,80,85,.35); position: relative;
  animation: popIn .26s cubic-bezier(.2,.9,.3,1.2);
}
.modal-box.wide { max-width: 760px; }
.modal-box h3 { font-size: 25px; margin-bottom: 6px; }
.modal-box .m-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; }
.modal-close {
  position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border-soft); background: #fff; color: var(--text-dim); font-size: 15px;
  display: grid; place-items: center; transition: all .18s ease;
}
.modal-close:hover { color: var(--red); border-color: var(--red); transform: rotate(90deg); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }

#toast {
  position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 26px);
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  padding: 13px 22px; border-radius: 99px; font-size: 13px; letter-spacing: .04em;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: all .32s cubic-bezier(.2,.9,.3,1.1);
  z-index: 200; display: flex; align-items: center; gap: 10px; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast .xp { background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #fff; border-radius: 99px; padding: 3px 11px; font-size: 11px; letter-spacing: .1em; }
#toast .st { background: linear-gradient(120deg, var(--gold-soft), var(--gold)); color: #6b5322; border-radius: 99px; padding: 3px 11px; font-size: 11px; letter-spacing: .1em; }

/* ---------- Intro & Magie ---------- */
.intro-overlay, .magic-overlay, .eat-overlay {
  position: fixed; inset: 0; z-index: 150;
  display: flex; flex-direction: column;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: radial-gradient(900px 640px at 50% 30%, #fff6f2, var(--bg-soft));
  animation: fadeIn .5s ease; padding: 34px 22px; text-align: center;
}
.intro-overlay > *, .magic-overlay > *, .eat-overlay > * { margin: auto; }
.magic-inner { max-width: 520px; }
.magic-glow { position: relative; display: grid; place-items: center; margin: 10px auto 22px; }
.magic-glow::before {
  content: ""; position: absolute; width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(228,167,172,.4), transparent 68%);
  animation: glowPulse 2.6s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100% { transform: scale(.92); opacity: .55; } 50% { transform: scale(1.08); opacity: 1; } }
.magic-glow svg { width: 220px; position: relative; z-index: 2; }
.spark { position: absolute; font-size: 17px; color: var(--gold); animation: sparkFly 2.4s ease-in-out infinite; }
@keyframes sparkFly { 0% { transform: translateY(0) scale(.6); opacity: 0; } 35% { opacity: 1; } 100% { transform: translateY(-46px) scale(1.15); opacity: 0; } }

/* ---------- Ambiente ---------- */
.amb { position: fixed; pointer-events: none; z-index: 0; opacity: .5; animation: ambFloat linear infinite; color: var(--accent); font-size: 12px; }
@keyframes ambFloat {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  12% { opacity: var(--o, .5); }
  88% { opacity: var(--o, .5); }
  100% { transform: translateY(-110vh) rotate(320deg); opacity: 0; }
}

/* ---------- Diverses ---------- */
.breadcrumb { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.breadcrumb b { color: var(--accent-2); font-weight: 500; }
.progress-ring-sm { width: 46px; height: 46px; flex: none; }
.detail-box {
  border: 1px dashed var(--border); border-radius: 12px; background: var(--panel-2);
  padding: 14px 17px; margin-top: 10px; font-size: 13px;
}
.detail-box h5 { font-family: var(--serif); font-size: 15.5px; margin-bottom: 5px; color: var(--accent-2); }
.detail-box ol, .detail-box ul { margin-left: 18px; }
.detail-box li { margin-bottom: 4px; }
.mini-stat { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--text-dim); }
.mini-stat b { color: var(--text); font-family: var(--serif); font-size: 17px; }
.hr { height: 1px; background: var(--border-soft); margin: 18px 0; border: 0; }
.avatar-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.avatar-opt {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: #fff;
  display: grid; place-items: center; font-size: 18px; cursor: pointer; transition: all .18s ease;
}
.avatar-opt:hover { transform: scale(1.1); }
.avatar-opt.sel { border-color: var(--accent-2); background: var(--accent-soft); box-shadow: 0 0 0 3px rgba(228,167,172,.25); }
.cat-bar-wrap { margin-bottom: 12px; }
.cat-bar-top { display: flex; justify-content: space-between; font-size: 11.5px; letter-spacing: .08em; margin-bottom: 5px; }
.cat-bar-top b { font-family: var(--serif); font-size: 15px; }
.day-dots { display: flex; gap: 5px; flex-wrap: wrap; }
.day-dots i {
  width: 9px; height: 9px; border-radius: 50%; background: rgba(228,167,172,.25); display: inline-block;
}
.day-dots i.on { background: linear-gradient(120deg, var(--accent), var(--accent-2)); }
.sparkle-row { letter-spacing: .32em; color: var(--gold); font-size: 11px; text-align: center; margin: 10px 0; }

/* ---------- Responsiv ---------- */
.menu-btn { display: none; }
@media (max-width: 1024px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .shop-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 780px) {
  .sidebar { transform: translateX(-100%); transition: transform .25s ease; }
  .sidebar.open { transform: none; }
  .main { margin-left: 0; padding: 20px 18px 110px; }
  .menu-btn {
    display: grid; place-items: center; position: fixed; top: 16px; left: 16px; z-index: 70;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel); color: var(--accent-2); box-shadow: var(--shadow-soft); font-size: 17px;
  }
  .topbar { margin-top: 46px; }
  .grid-2, .grid-3, .shop-grid, .form-row { grid-template-columns: 1fr; }
  .hero { flex-direction: column; text-align: center; }
  .cal-day { min-height: 58px; padding: 5px; }
  .cal-day .cd-ev { display: none; }
}

<script>
/* ============================================================
   H A U S G L Ü C K  ·  Daten
   ============================================================ */

const LEVELS = [

  { xp: 3800, name: "Perle des Hauses", lvl: 8 }
];
/* ============================================================
   P U T Z P L A N  ·  Was · Wann · Wie
   ============================================================ */

const ZONES = [
  { id: "kueche",   title: "Küche",            icon: "◆", color: "#e4a7ac", desc: "Kochen darf Spaß machen – solange die Küche danach wieder blitzt." },
  { id: "bad",      title: "Bad",              icon: "❋", color: "#cdb9d4", desc: "Frisch, klar und kalkfrei – dein kleines Spa-Zuhause." },
  { id: "wohnen",   title: "Wohnzimmer",       icon: "✿", color: "#c9a66b", desc: "Der Ort zum Ankommen – weich, sauber und gemütlich." },
  { id: "schlafen", title: "Schlafzimmer",     icon: "☾", color: "#9db89a", desc: "Ein Bett wie aus dem Hotel – jeden Tag aufs Neue." },
  { id: "flur",     title: "Flur & Außen",     icon: "✦", color: "#d08a87", desc: "Der erste Eindruck zählt – auch bei dir zuhause." }
];

const DAYS  = ["montag", "dienstag", "mittwoch", "donnerstag", "freitag", "samstag", "sonntag"];
const DAY_LABEL = { montag: "Montag", dienstag: "Dienstag", mittwoch: "Mittwoch", donnerstag: "Donnerstag", freitag: "Freitag", samstag: "Samstag", sonntag: "Sonntag" };

const PUTZ_TASKS = [
  /* ---- Küche ---- */
  { id: "p1", zone: "kueche", title: "Spüle & Arbeitsplatte", freq: "täglich", day: "täglich", time: "5 Min.",
    how: "<p>Die Küche wird nach jedem Kochen kurz zurückgelassen – das ist das Geheimnis einer dauerhaft sauberen Küche.</p><ol><li>Alles von der Arbeitsplatte räumen, Geschirr einräumen.</li><li>Spüle mit warmem Wasser und Spülmittel auswischen, Armatur abtrocknen (keine Kalkflecken!).</li><li>Arbeitsplatte mit dem Feuchttuch abwischen, am Ende trocken polieren.</li><li>Handtuch wechseln, wenn es feucht ist.</li></ol>",
    tip: "Ein Mikrofasertuch trocken nachpolieren lässt Edelstahl und Stein wie neu glänzen." },
  { id: "p2", zone: "kueche", title: "Herd & Backofen", freq: "Wöchentlich", day: "freitag", time: "15 Min.",
    how: "<p>Einmal die Woche gründlich – dann musst du nie wieder schrubben.</p><ol><li>Kochfeld abkühlen lassen, Platten herausnehmen.</li><li>Fettlösendes Reinigungsspray auftragen, 5 Minuten einwirken lassen.</li><li>Kochfeld, Knöpfe und Front mit dem Tuch abwischen.</li><li>Ofen: Krümel vom Boden wischen, bei Bedarf Ofenreiniger über Nacht einwirken lassen.</li></ol>",
    tip: "Backpulver + Wasser zu einem Brei verrühren, auf Fettstellen streichen und über Nacht wirken lassen – ganz ohne Chemie." },
  { id: "p3", zone: "kueche", title: "Kühlschrank auswischen", freq: "Wöchentlich", day: "samstag", time: "10 Min.",
    how: "<p>Ein kühler Kopf braucht einen kühlen, sauberen Schrank.</p><ol><li>Abgelaufene Reste und alte Säfte entsorgen.</li><li>Fächer herausnehmen und mit warmem Spülwasser abwaschen.</li><li>Innenwände mit Essigwasser (1 EL Essig auf 500 ml) auswischen.</li><li>Glasboden von unten abtrocknen, Fächer einräumen.</li></ol>",
    tip: "Ein geöffnetes Natron-Schälchen im Kühlschrank neutralisiert Gerüche für Wochen." },
  { id: "p4", zone: "kueche", title: "Schränke & Fassaden", freq: "Monatlich", day: "monatlich", time: "20 Min.",
    how: "<p>Was man von außen sieht, prägt das Gefühl von Ordnung.</p><ol><li>Schrankfronten und Griffe mit warmem Spülwasser abwischen.</li><li>Fettfilm über dem Herd mit Fettlöser entfernen.</li><li>Obere Kanten und den Kühlschrank-Dach abstauben.</li><li>Einen Schrank öffnen und kurz aussortieren – jeden Monat ein anderer.</li></ol>",
    tip: "Die 1-Schrank-Regel: Jeden Monat nur ein Schrank – nach einem Jahr ist die ganze Küche sortiert." },

  /* ---- Bad ---- */
  { id: "p5", zone: "bad", title: "Waschbecken & Spiegel", freq: "täglich", day: "täglich", time: "3 Min.",
    how: "<p>Täglich frisch in unter fünf Minuten.</p><ol><li>Waschbecken mit dem Feuchttuch auswischen, Armatur polieren.</li><li>Spiegel mit Glasreiniger und Mikrofasertuch streifenfrei putzen.</li><li>Seifenspender und Ablagen abwischen.</li><li>Handtuch glatt hängen oder wechseln.</li></ol>",
    tip: "Nach dem Zähneputzen kurz den Wasserhahn trocken wischen – so entsteht gar kein Kalk." },
  { id: "p6", zone: "bad", title: "Dusche reinigen", freq: "Wöchentlich", day: "mittwoch", time: "12 Min.",
    how: "<p>Kalk und Seifenreste haben gegen diese Routine keine Chance.</p><ol><li>Duschkabine mit warmem Wasser anfeuchten.</li><li>Reiniger (oder Essig-Spülmittel-Mix) auftragen, 10 Minuten einwirken.</li><li>Wände, Boden und Armatur mit der Duschbürste abreiben.</li><li>Gründlich abduschen, Glas mit dem Tuch trockenziehen.</li></ol>",
    tip: "Glas nach jeder Dusche mit dem Abzieher kurz abziehen – das spart die halbe Wochenarbeit." },
  { id: "p7", zone: "bad", title: "Toilette reinigen", freq: "Wöchentlich", day: "dienstag", time: "6 Min.",
    how: "<p>Schnell erledigt, wenn es zur Gewohnheit wird.</p><ol><li>Reiniger unter den Rand geben, 5 Minuten einwirken lassen.</li><li>Mit der Bürste gründlich durchbürsten, auch unter dem Rand.</li><li>Deckel, Sitz und Außenseite mit Desinfektionstuch abwischen.</li><li>Boden um die Toilette kurz wischen.</li></ol>",
    tip: "Ein Duftstein hinter die Toilette sorgt zwischen den Putztagen für frische Luft." },
  { id: "p8", zone: "bad", title: "Fugen & Lüften gründlich", freq: "Monatlich", day: "monatlich", time: "25 Min.",
    how: "<p>Der Tiefenreinigungs-Termin für dein Bad.</p><ol><li>Fugen mit Bürste und Fugenreiniger (oder Natron-Paste) abreiben.</li><li>Silikonfugen auf Schimmel prüfen – lieber früh handeln.</li><li>Ablaufgitter herausnehmen und den Haarfilter säubern.</li><li>Bad danach 20 Minuten Stoßlüften.</li></ol>",
    tip: "Schimmel in Fugen? Ein mit Alkohol getränktes Tuch 2 Stunden auflegen wirkt Wunder." },

  /* ---- Wohnzimmer ---- */
  { id: "p9", zone: "wohnen", title: "Aufräumen & Oberflächen", freq: "täglich", day: "täglich", time: "5 Min.",
    how: "<p>Die 5-Minuten-Abendroutine für ein ruhiges Zuhause.</p><ol><li>Alles, was nicht ins Wohnzimmer gehört, in einen Korb sammeln und verteilen.</li><li>Couchtisch, Sideboard und Fensterbank abwischen.</li><li>Kissen aufschütteln, Decke falten.</li><li>Boden einmal flüchtig überblicken – Krümel? Sofort wegräumen.</li></ol>",
    tip: "Fünf Minuten vor dem Schlafengehen mit Musik – dann fühlt sich Aufräumen nach Selbstfürsorge an." },
  { id: "p10", zone: "wohnen", title: "Staubwischen & saugen", freq: "Wöchentlich", day: "donnerstag", time: "20 Min.",
    how: "<p>Staub setzt sich ab – wir holen ihn ab.</p><ol><li>Von oben nach unten: Regale, Lampen, Rahmen abstauben.</li><li>Glasflächen und Bilderrahmen mit dem Mikrofasertuch abwischen.</li><li>Sofa, Sessel und unter den Couchtisch saugen.</li><li>Boden saugen, dabei auch hinter die Vorhänge.</li></ol>",
    tip: "Ein Fensterchen auf Kipp beim Staubwischen – der Staub zieht direkt nach draußen." },
  { id: "p11", zone: "wohnen", title: "Sofa & Kissen auffrischen", freq: "Wöchentlich", day: "sonntag", time: "15 Min.",
    how: "<p>So bleibt das Sofa ein Ort, an dem man versinken will.</p><ol><li>Decken und Bezüge aufschütteln, Kissen aufklopfen.</li><li>Sofa und Kissen mit dem Polstermündel (oder Staubsauger-Bürste) absaugen.</li><li>Flecken sofort mit feuchtem Tuch behandeln.</li><li>Bezüge bei Bedarf wechseln – sonntags ist Waschtag.</li></ol>",
    tip: "Ein Spritzer Wasser mit zwei Tropfen Lavendelöl im Sprühflakon – der Duft macht das Sofa neu." },
  { id: "p12", zone: "wohnen", title: "Fenster & Fensterbänke", freq: "Monatlich", day: "monatlich", time: "30 Min.",
    how: "<p>Licht rein, Staub raus.</p><ol><li>Fensterbänke abstauben und mit Glasreiniger abwischen.</li><li>Glas mit Glasreiniger und Tuch von oben nach unten putzen.</li><li>Fensterrahmen und Griffe abwischen.</li><li>Vorhänge absaugen oder kurz auslüften.</li></ol>",
    tip: "An trüben Tagen putzen – direkte Sonne lässt Streifen trocknen, bevor du sie wegwischen kannst." },

  /* ---- Schlafzimmer ---- */
  { id: "p13", zone: "schlafen", title: "Bett machen", freq: "täglich", day: "täglich", time: "2 Min.",
    how: "<p>Der kleinste Aufwand mit der größten Wirkung.</p><ol><li>Bettwäsche glatt ziehen, Kopfkissen aufschütteln.</li><li>Decke falten oder faltenrichtig ausbreiten.</li><li>Nachttisch: Glas raus, Kerze aus, Notizbuch hin.</li><li>Fenster für 5 Minuten auf – frische Luft im Bett.</li></ol>",
    tip: "Ein gemachtes Bett am Morgen ist der erste Erfolg des Tages – das verändert alles Weitere." },
  { id: "p14", zone: "schlafen", title: "Staubwischen & saugen", freq: "Wöchentlich", day: "montag", time: "15 Min.",
    how: "<p>Sanft schlafen – ohne Staub.</p><ol><li>Nachttische, Kommode und Lampe abstauben.</li><li>Unter dem Bett saugen (Dyson-Rohr oder Besen hilft).</li><li>Fußleisten kurz abwischen.</li><li>Bettzeug für 10 Minuten über das Fenster hängen – wie frisch gewaschen.</li></ol>",
    tip: "Matratze einmal im Monat mit dem Polstermündel absaugen – gut gegen Hausstaubmilben." },
  { id: "p15", zone: "schlafen", title: "Vorhänge & Bettkasten", freq: "Monatlich", day: "monatlich", time: "15 Min.",
    how: "<p>Die monatliche Tiefenpflege für das Schlafzimmer.</p><ol><li>Vorhänge abklopfen oder absaugen, bei Bedarf waschen.</li><li>Bettkasten öffnen und kurz sortieren.</li><li>Unter der Matratze und am Bettrahmen abstauben.</li><li>Saison-Sachen durchsortieren, was du nicht brauchst, weggeben.</li></ol>",
    tip: "Zwei Duftperlen im Bettkasten – die Bettwäsche riecht beim Umziehen wie frisch gewaschen." },
  { id: "p16", zone: "schlafen", title: "Fußboden wischen", freq: "Monatlich", day: "monatlich", time: "20 Min.",
    how: "<p>Barfußlaufen auf frischem Boden – ein kleines Ritual.</p><ol><li>Vorher gründlich saugen, auch unter dem Bett.</li><li>Wischmittel (weniger ist mehr!) in lauwarmem Wasser.</li><li>Von der Tür zur Mitte wischen, dabei Schranknähte mitnehmen.</li><li>Boden 10 Minuten trocknen lassen, Fenster auf.</li></ol>",
    tip: "Zu viel Reinigungsmittel macht den Boden klebrig – ein Spritzer genügt." },

  /* ---- Flur & Außen ---- */
  { id: "p17", zone: "flur", title: "Flur & Eingang aufräumen", freq: "Wöchentlich", day: "dienstag", time: "10 Min.",
    how: "<p>Der Flur ist die Visitenkarte deines Zuhauses.</p><ol><li>Schuhe ordnen, Paare zusammenstellen.</li><li>Garderobe ausdünnen – nur das, was du trägst, darf bleiben.</li><li>Diele wischen oder saugen, auch unter der Schuhablage.</li><li>Post durchsortieren, Werbung direkt entsorgen.</li></ol>",
    tip: "Eine kleine Schale für Schlüssel und Geldbeutel – nie wieder Suchen am Morgen." },
  { id: "p19", zone: "flur", title: "Müll & Wertstoff", freq: "Wöchentlich", day: "mittwoch", time: "8 Min.",
    how: "<p>Alles raus, bevor es ungemütlich wird.</p><ol><li>Mülleimer in Küche, Bad und Arbeitszimmer leeren.</li><li>Glas, Papier und Wertstoff zusammenstellen.</li><li>Altglas zum Container bringen (an den Weg zur Arbeit denken).</li><li>Neue Beutel einlegen, Eimer bei Bedarf auswischen.</li></ol>",
    tip: "Müllbeutel in die leeren Eimer stapeln – so hast du immer einen griffbereit." },
  { id: "p24", zone: "flur", title: "Balkon / Terrasse", freq: "Monatlich", day: "monatlich", time: "25 Min.",
    how: "<p>Draußen aufatmen – mit sauberem Lieblingsplatz.</p><ol><li>Möbel abwischen, Kissen ausklopfen.</li><li>Boden fegen oder mit dem Schrubber wischen.</li><li>Pflanzentöpfe von Moos und Algen befreien.</li><li>Geländer und Türklinke abwischen.</li></ol>",
    tip: "Ein Topf Lavendel oder Rosmarin – duftet und hält Mücken fern." },

  /* ---- Extra-Wochenplan ---- */
  { id: "p20", zone: "bad", title: "Spiegel & Glasflächen", freq: "Wöchentlich", day: "freitag", time: "8 Min.",
    how: "<p>Streifenfrei in zwei Minuten pro Fläche.</p><ol><li>Glasreiniger auftragen (weniger ist mehr).</li><li>Mit dem Mikrofasertuch in Z-Bewegung abwischen.</li><li>Am Ende mit einem trockenen Tuch nachpolieren.</li><li>Unterkanten und Rahmen nicht vergessen.</li></ol>",
    tip: "Alte Zeitungen polieren Glas streifenfrei – und kosten nichts." },
  { id: "p21", zone: "kueche", title: "Spülmaschine reinigen", freq: "Wöchentlich", day: "samstag", time: "8 Min.",

const STORAGE_KEY = "haushaltsPlaner_v2";

function dateToStr(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayStr() { return dateToStr(new Date()); }
function parseDate(s) { return new Date(s + "T00:00:00"); }
function addDays(d, n) { const x = new Date(d.getTime() + n * 86400000); return x; }
function addDaysStr(s, n) { return dateToStr(addDays(parseDate(s), n)); }
function dayDiff(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
const MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const MONTHS_SHORT = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const DAY_SHORT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
function fmtDate(s) { const d = parseDate(s); return DAY_SHORT[d.getDay()] + ", " + d.getDate() + ". " + MONTHS_SHORT[d.getMonth()]; }
function weekStart(offset) {
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const mon = addDays(now, -dow + (offset || 0) * 7);
  return dateToStr(mon);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function uid() { return "id" + Math.random().toString(36).slice(2, 9); }
function randomOf(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function loadState() {
  let s;
  try { s = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { s = null; }
  const def = {

    xp: 0, streak: 0, lastStudy: null, activeDays: [], sterne: 0, dayRewarded: null,
    taskDone: {}, taskNext: {}, todos: [], shopping: [], meals: {}, events: [], expenses: [],
    budgetLimit: 0, budgetSet: false, recipes: [], customTasks: [],
    stage: 0, hatchDate: null, catType: null, catName: null, catGender: null,
    ownedItems: [], equipped: {}, companionHidden: false, companionPos: null
  };
  if (!s || typeof s !== "object") s = {};
  s = Object.assign(def, s);
  if (!s.budgetSet) s.budgetLimit = 0;
  if (!Array.isArray(s.customTasks)) s.customTasks = [];
  return s;
}

/* ---- XP & Level ---- */
function getLevel() {
  let cur = LEVELS[0], next = LEVELS[LEVELS.length - 1];
  for (let i = 0; i < LEVELS.length; i++) {
    if (state.xp >= LEVELS[i].xp) cur = LEVELS[i];
    if (LEVELS[i].xp > state.xp) { next = LEVELS[i]; break; }
  }
  return { cur, next };
}
function roman(n) {
  const map = [[10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  let out = "";
  map.forEach(([v, s]) => { while (n >= v) { out += s; n -= v; } });
  return out || "I";
}

/* ---- Aktivität & Serie ---- */
function registerStudy() {
  const today = todayStr();
  if (!state.activeDays.includes(today)) state.activeDays.push(today);
  if (state.lastStudy !== today) {
    const yesterday = dateToStr(new Date(Date.now() - 86400000));
    if (state.lastStudy === yesterday) state.streak = (state.streak || 0) + 1;
    else state.streak = 1;
    state.lastStudy = today;
    state.sterne = (state.sterne || 0) + 1;
  }
  checkCompanion();
}
function addXp(amount, label, silent) {
  state.xp += amount;
  registerStudy();
  saveState();
  if (!silent) showToast(label || "Geschafft", amount);
  checkDayReward();
}
function addSterne(amount, label) {
  state.sterne += amount;
  saveState();
  showToast(label || "Sterne gesammelt", 0, amount);
}
function checkDayReward() {
  if (state.dayRewarded === todayStr()) return;
  const openTasks = dueTasksToday().length;
  const openTodos = state.todos.filter(x => !x.done && x.due <= todayStr()).length;
  const anythingThere = allTasks().some(t => isTaskDoneToday(t.id)) || state.todos.some(x => x.due <= todayStr());
  if (openTasks === 0 && openTodos === 0 && anythingThere) {
    state.dayRewarded = todayStr();
    state.sterne += 2;
    saveState();
    showToast("Tag geschafft! Alles erledigt ✨", 0, 2);
  }
}

/* ---- Putzplan-Logik: Fälligkeits-Zyklen ---- */
function isTaskDoneToday(id) {
  return !!(state.taskDone[id] && state.taskDone[id].includes(todayStr()));
}
function taskLastDone(id) {
  const arr = state.taskDone[id] || [];
  return arr.length ? arr[arr.length - 1] : null;
}
function allTasks() { return PUTZ_TASKS.concat(state.customTasks || []); }
function taskEvery(t) {
  if (t.every) return t.every;
  return t.freq === "täglich" ? 1 : t.freq === "Monatlich" ? 30 : 7;
}
function taskIntervalLabel(t) {
  const e = taskEvery(t);
  if (e === 1) return "täglich";
  if (e === 7) return "wöchentlich";
  if (e === 14) return "alle 2 Wochen";
  if (e === 30) return "monatlich";
  if (e === 90) return "alle 3 Monate";
  return "alle " + e + " Tage";
}
function initTaskSchedule() {
  const today = todayStr();
  const t7 = allTasks().filter(x => taskEvery(x) < 30);
  const t30 = allTasks().filter(x => taskEvery(x) >= 30);
  allTasks().forEach(t => {
    if (state.taskNext[t.id]) return;
    const e = taskEvery(t);
    if (e === 1) state.taskNext[t.id] = today;
    else if (e < 30) state.taskNext[t.id] = addDaysStr(today, t7.indexOf(t) % e);
    else state.taskNext[t.id] = addDaysStr(today, (t30.indexOf(t) * 4) % e);
  });
}
function taskStatus(t) {
  const due = state.taskNext[t.id] || todayStr();
  const diff = dayDiff(todayStr(), due);
  const doneToday = isTaskDoneToday(t.id);
  return { due, diff, doneToday, overdue: diff < 0 && !doneToday, dueNow: diff <= 0 };
}
function dueTasksToday() {
  return allTasks().filter(t => taskStatus(t).dueNow && !isTaskDoneToday(t.id));
}
function todayStats() {
  const done = allTasks().filter(t => isTaskDoneToday(t.id)).length;
  const open = dueTasksToday().length;
  return { done, open, total: done + open, pct: (done + open) ? Math.round(done / (done + open) * 100) : 0 };
}
function upcomingTasks(count) {
  return allTasks().slice()
    .sort((a, b) => (state.taskNext[a.id] || todayStr()).localeCompare(state.taskNext[b.id] || todayStr()))
    .slice(0, count || 6);
}
function zoneTasks(zoneId) { return allTasks().filter(t => t.zone === zoneId); }
function zoneProgress(zoneId) {
  const ts = zoneTasks(zoneId);
  const done = ts.filter(t => taskStatus(t).diff > 0 || isTaskDoneToday(t.id)).length;
  return { done, total: ts.length, pct: ts.length ? Math.round(done / ts.length * 100) : 0 };
}
function overallProgress() { return todayStats(); }
function toggleTask(id) {
  const t = allTasks().find(x => x.id === id);
  if (!t) return;
  const arr = state.taskDone[id] || (state.taskDone[id] = []);
  const today = todayStr();
  if (isTaskDoneToday(id)) {
    const i = arr.lastIndexOf(today);
    if (i >= 0) arr.splice(i, 1);
    state.taskNext[id] = today;
    state.xp = Math.max(0, state.xp - 12);
    saveState();
    refresh();
    return;
  }
  arr.push(today);
  state.taskNext[id] = addDaysStr(today, taskEvery(t));
  addXp(12, t.title + " erledigt");
  companionSay(randomOf(COMPANION_CHEERS));
  checkDayReward();
  refresh();
}

/* ---- Toast ---- */
function showToast(text, xp, st) {
  const el = document.getElementById("toast");
  let chips = "";
  if (xp) chips += '<span class="xp">' + (xp > 0 ? "+" : "") + xp + ' XP</span>';
  if (st) chips += '<span class="st">' + (st > 0 ? "+" : "") + st + ' ★</span>';
  el.innerHTML = esc(text) + chips;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 3200);
}

/* ---- Sidebar ---- */
function updateSidebar() {
  const { cur, next } = getLevel();
  const idx = LEVELS.indexOf(cur) + 1;
  const span = Math.max(1, next.xp - cur.xp);
  const pct = Math.min(100, Math.round((state.xp - cur.xp) / span * 100));
  const el = id => document.getElementById(id);
  if (!el("sideLevel")) return;
  el("sideLevel").textContent = cur.lvl ? roman(cur.lvl) : roman(idx);
  el("sideRank").textContent = cur.name;
  el("sideXp").textContent = state.xp + " / " + next.xp + " XP";
  el("sideXpBar").style.width = pct + "%";
  el("sideUser").textContent = (state.userName ? state.userName : "Gast") + " · ★ " + (state.sterne || 0) + " Sterne";
}

function ringSvg(pct, size) {
  size = size || 110;
  const r = size / 2 - 9, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="rgba(228,167,172,.22)" stroke-width="8"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
    '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e4a7ac"/><stop offset="100%" stop-color="#c9a66b"/></linearGradient></defs>' +
    '</svg>';
}

/* ---------------- Kalender ---------------- */
function renderKalender(main) {
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) {
    const d = new Date(y, m, -startDow + i + 1);
    cells.push({ ds: dateToStr(d), num: d.getDate(), other: true });
  }
  for (let i = 1; i <= daysInMonth; i++) cells.push({ ds: dateToStr(new Date(y, m, i)), num: i, other: false });
  while (cells.length % 7) {
    const d = new Date(y, m + 1, cells.length - startDow - daysInMonth + 1);
    cells.push({ ds: dateToStr(d), num: d.getDate(), other: true });
  }
  const upcoming = state.events.filter(e => e.date >= todayStr()).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  main.innerHTML =
    '<div class="topbar"><div>' +
      '<div class="overline">Übersicht</div><h2>Kalender</h2>' +
      '<p class="sub">Termine, Pläne und kleine Vorfreuden – alles an einem Ort.</p>' +
    '</div>' +
    '<div class="btn-row" style="margin:0">' +
      '<button class="btn ghost" onclick="calMove(-1)">‹ Zurück</button>' +
      '<button class="btn ghost" onclick="calToday()">Heute</button>' +
      '<button class="btn primary" onclick="showEventModal()">+ Termin</button>' +
    '</div></div>' +

    '<div class="card">' +
      '<div class="section-head"><h3>' + MONTHS[m] + ' ' + y + '</h3>' +
      '<div class="btn-row" style="margin:0"><button class="btn small ghost" onclick="calMove(1)">› Weiter</button></div></div>' +
      '<div class="cal-grid">' +
        ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map(d => '<div class="cal-head">' + d + '</div>').join("") +
        cells.map(c => {
          const evs = state.events.filter(e => e.date === c.ds);
          return '<div class="cal-day' + (c.other ? " other" : "") + (c.ds === todayStr() ? " today" : "") + '" onclick="showDayModal(\'' + c.ds + '\')">' +
            '<div class="cd-num">' + c.num + '</div>' +
            evs.slice(0, 2).map((e, i) => '<div class="cd-ev' + (i === 1 ? " gold" : "") + '">' + esc(e.title) + '</div>').join("") +
            (evs.length > 2 ? '<div class="cd-ev green">+' + (evs.length - 2) + ' mehr</div>' : "") +
          '</div>';
        }).join("") +
      '</div>' +
    '</div>' +

    '<div class="section">' +
      '<div class="section-head"><h3>Was ansteht</h3><span class="tag">' + upcoming.length + ' Termine</span></div>' +
      (upcoming.length ? upcoming.map(e =>
        '<div class="check-row">' +
        '<div class="cr-mid"><div class="cr-title">' + esc(e.title) + '</div>' +
        '<div class="cr-meta">' + fmtDate(e.date) + (e.time ? " · " + e.time : "") + (e.note ? " · " + esc(e.note) : "") + '</div></div>' +
        '<div class="cr-right"><span class="tag grey">' + esc(e.cat || "Termin") + '</span>' +
        '<button class="icon-btn" onclick="deleteEvent(\'' + e.id + '\')">✕</button></div></div>'
      ).join("") : '<div class="empty">Nichts geplant – die perfekte Gelegenheit für einen Kaffee.</div>') +
    '</div>';
}
function calMove(dir) { calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + dir, 1); refresh(); }
function calToday() { calCursor = new Date(); refresh(); }

function showDayModal(ds) {

      '<div class="cr-right"><button class="icon-btn" onclick="deleteEvent(\'' + e.id + '\');showDayModal(\'' + ds + '\')">✕</button></div></div>'

  const anstehendView =
    '<div class="card" style="margin-bottom:16px">' +

    '</div>' +
    '<div class="card">' +
      '<div class="section-head"><h3>' + (putzFilter === "faellig" ? "Was jetzt ansteht" : putzFilter === "erledigt" ? "Heute erledigt" : "Alle Aufgaben") + '</h3>' +
      '<div class="btn-row" style="margin:0">' +

      '<div class="section-head"><h3>Deine Liste</h3></div>' +
      (list.length ? list.map(x => todoRowHtml(x)).join("") : '<div class="empty">Nichts auf der Liste – wie leicht das sich anfühlt.</div>') +

function saveTodo() {
  const text = (document.getElementById("tdText").value || "").trim();
  if (!text) { showToast("Bitte einen Text eingeben"); return; }
  state.todos.unshift({
    id: uid(), text,
    due: document.getElementById("tdDue").value || todayStr(),
    cat: document.getElementById("tdCat").value,
    prio: document.getElementById("tdPrio").value,
    done: false
  });
  saveState();
  addXp(3, "Notiert", 0);
  refresh();
}
function toggleTodo(id) {
  const x = state.todos.find(t => t.id === id);
  if (!x) return;
  x.done = !x.done;
  if (x.done) {
    addXp(8, x.text + " erledigt");
    companionSay(randomOf(COMPANION_CHEERS));
  } else {
    state.xp = Math.max(0, state.xp - 8);
    saveState();
  }
  checkDayReward();
  refresh();
}
function deleteTodo(id) {
  state.todos = state.todos.filter(t => t.id !== id);
  saveState(); refresh();
}

function saveShopping() {
  const name = (document.getElementById("shName").value || "").trim();
  if (!name) { showToast("Bitte einen Artikel eingeben"); return; }
  state.shopping.unshift({ id: uid(), name, cat: document.getElementById("shCat").value, qty: (document.getElementById("shQty").value || "").trim(), done: false });
  saveState(); addXp(2, "Auf die Liste", 0); refresh();
}
function toggleShopping(id) {
  const i = state.shopping.find(x => x.id === id);
  if (!i) return;
  i.done = !i.done;
  if (i.done) addXp(3, i.name + " im Korb");
  else { state.xp = Math.max(0, state.xp - 3); saveState(); }
  refresh();
}
function deleteShopping(id) {
  state.shopping = state.shopping.filter(x => x.id !== id);
  saveState(); refresh();
}
function finishShopping() {
  const done = state.shopping.filter(i => i.done);
  if (!done.length) { showToast("Der Korb ist noch leer"); return; }
  state.shopping = state.shopping.filter(i => !i.done);
  saveState();
  addXp(20, "Einkauf erledigt");
  addSterne(2, "Einkauf abgeschlossen");
  companionSay(randomOf(COMPANION_CHEERS));
  refresh();
}
function addAllFromMeals() {
  const ing = new Set();
  Object.values(state.meals).forEach(m => Object.values(m).forEach(v => {
    const info = mealInfo(v);
    if (info) info.ing.forEach(x => ing.add(x));
  }));
  if (!ing.size) { showToast("Noch keine Zutaten im Essensplan"); return; }
  let added = 0;
  ing.forEach(n => {
    if (!state.shopping.some(s => s.name.toLowerCase() === n.toLowerCase() && !s.done)) {
      state.shopping.push({ id: uid(), name: n, cat: "Lebensmittel", qty: "", done: false });
      added++;
    }
  });
  saveState();
  showToast(added + " Zutaten übernommen");
  refresh();
}

function mealInfo(val) {
  if (!val) return null;
  if (val.indexOf("idea:") === 0) {
    const i = MEAL_IDEAS[parseInt(val.slice(5))];
    return i ? { name: i.name, ing: i.ing } : null;
  }
  if (val.indexOf("recipe:") === 0) {
    const r = state.recipes.find(x => x.id === val.slice(7));
    return r ? { name: r.name, ing: r.ing || [] } : null;
  }
  return { name: val, ing: [] };
}
function mealSlot(ds, key, label, val) {
  const info = mealInfo(val);
  const disp = info ? info.name : "";
  return '<div class="check-row" style="cursor:pointer" onclick="showMealModal(\'' + ds + '\',\'' + key + '\')">' +
    '<div class="cr-mid"><div class="cr-meta">' + label + '</div>' +
    '<div class="cr-title"' + (disp ? "" : ' style="color:var(--text-dim);font-weight:400"') + '>' + (disp ? esc(disp) : "– offen –") + '</div></div>' +
    '<div class="cr-right"><span class="icon-btn">✎</span></div></div>';
}
function showMealModal(ds, key) {
  const m = state.meals[ds] || {};
  const cur = m[key] || "";

  const curText = info ? info.name : "";
  const label = { f: "Frühstück", m: "Mittagessen", a: "Abendessen" }[key];
  showModal(
    '<h3>' + label + '</h3><p class="m-sub">' + fmtDate(ds) + '</p>' +
    '<div class="form-row one"><div class="field"><label>Was gibt es?</label>' +
    '<input class="input" id="mealText" value="' + esc(curText) + '" placeholder="z. B. Ofengemüse mit Feta"></div></div>' +
    '<div class="btn-row"><button class="btn gold" onclick="randomMeal(\'' + ds + '\',\'' + key + '\')">✦ Zufällige Idee</button>' +
    '<button class="btn ghost" onclick="clearMeal(\'' + ds + '\',\'' + key + '\')">Weglassen</button></div>' +
    '<hr class="hr">' +
    '<div class="btn-row"><button class="btn primary" onclick="saveMeal(\'' + ds + '\',\'' + key + '\')">Speichern</button>' +

function saveMeal(ds, key) {

function clearMeal(ds, key) {
  if (state.meals[ds]) delete state.meals[ds][key];

}
function randomMeal(ds, key) {
  const pool = MEAL_IDEAS.map((_, i) => "idea:" + i).concat(state.recipes.map(r => "recipe:" + r.id));
  const ref = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  state.meals[ds] = state.meals[ds] || {};
  state.meals[ds][key] = ref || "";
  saveState(); closeModal();
  if (ref) addXp(2, (mealInfo(ref) || {}).name + " eingeplant", 0);

function showMealPicker(ref) {

  const spent = monthExp.reduce((s, e) => s + e.amount, 0);
  const limit = state.budgetLimit || 0;
  const rest = limit - spent;
  const pct = limit ? Math.min(100, Math.round(spent / limit * 100)) : 0;
  const byCat = BUDGET_CATS.map(c => ({ ...c, sum: monthExp.filter(e => e.cat === c.id).reduce((s, e) => s + e.amount, 0) })).filter(c => c.sum > 0);

      '<div class="stat"><div class="k">Verfügbar</div><div class="v" style="color:' + (rest < 0 ? "var(--red)" : "var(--green)") + '">' + rest.toFixed(2) + ' <small>€</small></div></div>' +
      '<div class="stat"><div class="k">Genutzt</div><div class="v">' + pct + ' <small>%</small></div><div class="bar" style="margin-top:8px"><i style="width:' + pct + '%"></i></div></div>' +

      '<div class="card">' +
        '<div class="section-head"><h3>Nach Kategorie</h3></div>' +

        '<div class="section-head"><h3>Ausgaben</h3><span class="tag grey">' + monthExp.length + ' Einträge</span></div>' +

          '<div class="cr-right"><b style="font-family:var(--serif);font-size:17px">' + e.amount.toFixed(2) + ' €</b>' +

/* ---- Entwicklung ---- */
function learnedDaysInWeek() {
  const start = state.hatchDate || todayStr();
  return state.activeDays.filter(d => dayDiff(start, d) >= -1 && dayDiff(start, d) <= 7).length;
}
function checkCompanion() {
  if (!state.introSeen) return;
  if (state.stage === 1 && (state.streak || 0) >= 3) {
    state.stage = 2;
    state.hatchDate = todayStr();
    saveState();
    showHatchSequence();
  } else if (state.stage === 2 && state.hatchDate && dayDiff(state.hatchDate, todayStr()) >= 7) {
    const learned = learnedDaysInWeek();
    state.catType = learned >= 6 ? "glitzer" : learned >= 4 ? "stubenweise" : "samtpfote";
    state.stage = 3;
    saveState();
    showEvolutionModal();
  }
}
function buddyKey() { return state.stage >= 3 && state.catType ? state.catType : state.stage >= 2 ? "baby" : "basket"; }
function companionFigure(size) {
  if (state.stage < 2) return basketSvg(size);
  return catSvg(buddyKey(), size);
}

const COMPANION_SAYINGS = [

function companionSay(msg) {
  const bubble = document.getElementById("cwBubble");
  if (!bubble) return;

  clearTimeout(companionSay._t);
  companionSay._t = setTimeout(() => {
    if (document.getElementById("cwBubble")) document.getElementById("cwBubble").textContent = "Miau!";

}
function toggleCompanion() {

}
function initCompanion() {
  let w = document.getElementById("companionWidget");
  if (w) w.remove();
  w = document.createElement("div");
  w.id = "companionWidget";
  w.innerHTML =
    '<div class="cw-bubble" id="cwBubble">Miau! Schön, dass du da bist.</div>' +
    '<div class="cw-fig" id="cwFig" ondblclick="showBuddyDetails()">' + companionFigure(118) + '</div>';
  document.body.appendChild(w);
  if (state.companionHidden) w.style.display = "none";
  if (state.companionPos) {
    w.style.left = state.companionPos.x + "px";
    w.style.top = state.companionPos.y + "px";
    w.style.right = "auto";
    w.style.bottom = "auto";
  }

  let drag = null;
  const start = e => {
    const p = e.touches ? e.touches[0] : e;
    const rect = w.getBoundingClientRect();
    drag = { dx: p.clientX - rect.left, dy: p.clientY - rect.top, moved: false };
  };
  const move = e => {
    if (!drag) return;
    const p = e.touches ? e.touches[0] : e;
    drag.moved = true;
    w.style.left = Math.max(8, Math.min(window.innerWidth - 130, p.clientX - drag.dx)) + "px";
    w.style.top = Math.max(8, Math.min(window.innerHeight - 160, p.clientY - drag.dy)) + "px";
    w.style.right = "auto";
    w.style.bottom = "auto";
  };
  const end = () => {
    if (drag && drag.moved) {
      state.companionPos = { x: parseInt(w.style.left), y: parseInt(w.style.top) };
      saveState();
    }
    drag = null;
  };
  w.addEventListener("mousedown", start);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  w.addEventListener("touchstart", start, { passive: true });
  window.addEventListener("touchmove", move, { passive: true });
  window.addEventListener("touchend", end);

  if (!initCompanion._t) {
    initCompanion._t = setInterval(() => {
      if (Math.random() < .35 && !state.companionHidden) companionSay(randomOf(COMPANION_SAYINGS));
    }, 26000);
  }
}

function buddyFigure(size) {
  const key = buddyKey();
  const inner = catSvg(key).replace(/^[\s\S]*?<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
  let behind = "", front = "";
  (state.ownedItems || []).forEach(id => {
    const it = SHOP_ITEMS.find(x => x.id === id);
    if (!it || !it.place || state.equipped[it.slot] !== id) return;
    const g = '<g transform="translate(' + it.place[0] + ',' + it.place[1] + ') scale(' + (it.place[2] || 1) + ') translate(-100,-100)">' + it.art + '</g>';
    if (it.behind) behind += g; else front += g;
  });
  return '<svg width="' + (size || 220) + '" height="' + (size || 220) + '" viewBox="0 0 200 200">' + behind + inner + front + '</svg>';
}
function companionFigure(size) {
  if (state.stage < 2) return basketSvg(size);
  return buddyFigure(size);
}

function buyItem(id) {
  const it = SHOP_ITEMS.find(x => x.id === id);
  if (!it || state.ownedItems.includes(id)) return;
  if (state.sterne < it.price) { showToast("Noch nicht genug Sterne"); return; }
  state.sterne -= it.price;
  state.ownedItems.push(id);
  if (it.slot) state.equipped[it.slot] = id;
  saveState();
  showToast(it.name + " gehört jetzt deinem Kätzchen", 0, -it.price);
  initCompanion();
  refresh();
}
function toggleEquip(id) {
  const it = SHOP_ITEMS.find(x => x.id === id);
  if (!it || !it.slot) return;
  if (state.equipped[it.slot] === id) delete state.equipped[it.slot];
  else state.equipped[it.slot] = id;
  saveState();
  initCompanion();
  refresh();
}

/* ---- Sounds ---- */
let actx = null, musicTimer = null, musicStep = 0;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  return actx;
}
function playClick() {
  if (!state.clickSound) return;
  const c = ac();
  if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = "sine";
  o.frequency.value = 880;
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.06, c.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.09);
  o.connect(g).connect(c.destination);
  o.start(); o.stop(c.currentTime + 0.1);
}
function playTone(freq, t, dur, vol) {
  const c = ac();
  if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, c.currentTime + t);
  g.gain.exponentialRampToValueAtTime(vol || 0.05, c.currentTime + t + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t + dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime + t);
  o.stop(c.currentTime + t + dur + 0.05);
}
const MOTIF = [261.6, 329.6, 392.0, 523.3, 392.0, 329.6, 293.7, 349.2, 440.0, 587.3, 440.0, 349.2];
let bgAudio = null, fadeTimer = null;
function fadeBg(to, secs) {
  if (!bgAudio) return;
  clearInterval(fadeTimer);
  const from = bgAudio.volume, steps = Math.max(1, Math.round(secs * 20));
  let i = 0;
  fadeTimer = setInterval(() => {
    i++;
    bgAudio.volume = Math.max(0, Math.min(1, from + (to - from) * (i / steps)));
    if (i >= steps) clearInterval(fadeTimer);
  }, 50);
}
function startMusic() {
  if (!state.soundOn) return;
  if (!bgAudio) {
    try {
      bgAudio = new Audio("media/musik.mp3");
      bgAudio.loop = true;
      bgAudio.volume = 0;
    } catch (e) { bgAudio = null; }
  }
  if (bgAudio) {
    const p = bgAudio.play();
    if (p && p.catch) p.catch(() => startMelody());
    fadeBg(0.32, 2.2);
    return;
  }
  startMelody();
}
function startMelody() {
  const c = ac();
  if (!c || musicTimer) return;
  const bar = () => {
    if (!state.soundOn) return;
    MOTIF.forEach((f, i) => playTone(f, i * 1.1, 1.6, 0.028));
  };
  bar();
  musicTimer = setInterval(bar, MOTIF.length * 1100 + 900);
}
function stopMusic() {
  if (bgAudio) {
    fadeBg(0, 0.8);
    setTimeout(() => { if (bgAudio && !state.soundOn) bgAudio.pause(); }, 850);
  }
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}
function toggleSound() {
  state.soundOn = !state.soundOn;
  saveState();
  if (state.soundOn) startMusic(); else stopMusic();
  showSettings();
}
function toggleClickSound() {
  state.clickSound = !state.clickSound;
  saveState();
  showSettings();
}

    s.style.setProperty("--o", .25 + Math.random() * .35);
    s.style.animationDuration = 26 + Math.random() * 34 + "s";
    s.style.animationDelay = -Math.random() * 40 + "s";
    document.body.appendChild(s);
  }
}

/* ============================================================
   S T A R T
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".nav-item").forEach(n => {
    n.addEventListener("click", () => {
      navigate(n.dataset.view);
      document.getElementById("sidebar").classList.remove("open");
    });
  });

  initAmbient();
  initCompanion();
  updateSidebar();
  navigate("dashboard", { silent: true });

  if (!state.introSeen) showIntro();
  checkCompanion();

  const gate = () => {
    if (state.soundOn) startMusic();
    window.removeEventListener("pointerdown", gate);
  };
  window.addEventListener("pointerdown", gate);

  window.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });
});
</script>
</body>
</html>
